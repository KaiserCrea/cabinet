<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8912F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="icon" href="icones/icone-192.png">
<title>Mon Cabinet</title>
<style>
@font-face{font-family:'Lora';src:url('polices/lora.ttf') format('truetype');font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:'Ecriture';src:url('polices/ecriture.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Lora';src:url('polices/lora-italique.ttf') format('truetype');font-weight:400 700;font-style:italic;font-display:swap}
:root{--ech:1;
  --serif:'Lora',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --or-sombre:#4C3A0E;--or-moyen:#6B5316;--or:#8A6A1E;--or-vif:#C9A54B;
  --or-pale:#F3E3B8;--or-clair:#FFF6DC;--or-fond:#FBF4E1;
  --trait-or:#FFF3D166;--trait-or2:#FFF3D133;
  --ivoire:#FFFEFA;--creme:#FFFBF0;
  --nuit:#1B1527;--encre:#17284C;
  --bleu:#17284C;--bleu2:#3E5A8A;--bleu3:#5B739E;--bleu4:#3C4D70;--bleu5:#7389AC;
  --violet:#6B5E8C;--violet-fond:#F1EDF7;
  --fuchsia:#8E2566;--fuchsia-fond:#FBE7F3;--fuchsia-clair:#E8BCD8;
  --gris:#7389AC;--ligne:#E6DECF;--ligne-fine:#EFE8DA;
  --carte:#FFFEFA;--radius:16px;
  --ombre:0 10px 32px #3E2F0B40, 0 2px 8px #3E2F0B2b;
  --ombre-haute:0 14px 44px #2A200855, 0 4px 14px #2A20083d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:#A8842F;color:var(--bleu);font-family:var(--sans);font-size:calc((15px) * var(--ech));line-height:1.55;
  -webkit-font-smoothing:antialiased;position:relative;min-height:100vh;overflow-x:hidden;
  -webkit-user-select:none;user-select:none;touch-action:pan-y
}
#fond{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 78% -16%,#E6C97E 0%,#C9A54B 32%,#A8842F 64%,#7E621F 100%)}
#fond .brosse{position:absolute;inset:-20%;filter:blur(24px);
  background:linear-gradient(112deg,transparent 24%,#FFF2CE2e 40%,#FFFAEA55 48%,#C9A54B2e 58%,transparent 74%)}
#fond .rais{position:absolute;inset:0;background:linear-gradient(44deg,transparent 34%,#FFEFC224 50%,transparent 66%)}
#fond i{position:absolute;border-radius:50%;background:#FFFDF2;box-shadow:0 0 5px #FFF8E0}
@media (prefers-reduced-motion:no-preference){#fond i.sc{animation:scint var(--d,8s) ease-in-out infinite}}
@keyframes scint{0%,100%{opacity:.14;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;-webkit-user-select:text;user-select:text}
h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 18px calc(70px + env(safe-area-inset-bottom))}

/* ---------- en-tête ---------- */
.marque{text-align:center;padding:8px 0 2px}
.marque .nom{font-family:var(--serif);font-size:calc((10.5px) * var(--ech));letter-spacing:7px;text-transform:uppercase;
  color:var(--or-sombre);text-shadow:0 1px 0 #FFF6DC73}
.marque .sous{display:none}
.filet{display:none}
.datebtn{border:0;background:none;padding:0;display:block;width:100%;text-align:center;
  font-family:var(--serif);font-weight:500;font-size:calc((clamp(25px,6.4vw,38px)) * var(--ech));line-height:1.1;margin:11px 0 0;
  letter-spacing:-.015em;-webkit-background-clip:text;background-clip:text;color:transparent;
  background-image:linear-gradient(100deg,#FFEFC4,#FFFFFF 24%,#D9B96A 46%,#FFFEF6 66%,#EBD69B);
  filter:drop-shadow(0 2px 3px #4c3a0e59) drop-shadow(0 1px 0 #FFFBEE4d)}
.orne{display:flex;align-items:center;justify-content:center;gap:12px;color:#FFF3D1;font-size:calc((8px) * var(--ech));
  letter-spacing:6px;margin-top:11px;opacity:.85}
.orne span{height:1px;width:66px;background:linear-gradient(90deg,transparent,currentColor)}
.orne span:last-child{background:linear-gradient(90deg,currentColor,transparent)}
.daycount{text-align:center;font-family:var(--serif);font-style:italic;font-size:calc((15px) * var(--ech));color:#3E2F0B;
  margin:12px 0 0;text-shadow:0 1px 0 #FFF6DC66}
.datebar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.arrow,.cal{width:38px;height:38px;border:1px solid var(--trait-or);background:#FFFBEE1f;
  display:grid;place-items:center;color:var(--or-clair);flex:none;font-size:calc((17px) * var(--ech));
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:.18s;border-radius:50%}
.arrow:active,.cal:active{transform:scale(.93)}
.arrow:hover,.cal:hover{background:#FFFBEE38;border-color:#FFF6DCAA}
.cal{border-radius:11px}
.cal svg{width:17px;height:17px;display:block}
.today-chip{border:1px solid var(--trait-or);background:#FFFBEE1f;color:var(--or-clair);border-radius:30px;
  padding:7px 15px;font-family:var(--serif);font-size:calc((10.5px) * var(--ech));letter-spacing:2.5px;text-transform:uppercase;
  backdrop-filter:blur(4px);text-shadow:0 1px 2px #3E2F0B59;transition:.18s}
.today-chip:hover{background:#FFFBEE38}
.lunebadge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--trait-or);
  background:#FFFBEE26;color:#FFFCEE;border-radius:999px;padding:2px 11px 2px 4px;
  font-family:var(--serif);font-size:calc((10.5px) * var(--ech));letter-spacing:2px;vertical-align:middle;
  text-shadow:0 1px 2px #3E2F0B59;font-style:normal}
.lunebadge svg{display:block}
.jnom .lune7{display:flex;align-items:center;gap:4px;color:#FFFCEE;font-size:calc((9.5px) * var(--ech));letter-spacing:1.4px;
  margin-top:5px;text-shadow:0 1px 2px #3E2F0B66}

/* ---------- bascule jour / semaine ---------- */
.switch{display:flex;justify-content:center;width:fit-content;margin:16px auto 0;
  border:1px solid var(--trait-or);border-radius:30px;padding:3px;background:#FFFBEE1f;
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.switch button{border:0;background:none;border-radius:30px;padding:8px 22px;font-family:var(--serif);
  font-size:calc((11px) * var(--ech));letter-spacing:3px;text-transform:uppercase;color:#FFFCEE;transition:.2s;
  text-shadow:0 1px 2px #3E2F0B66}
.switch button[aria-pressed="true"]{background:linear-gradient(180deg,#FFFEFA,#FDF8EC);color:#2E2745;
  font-weight:600;text-shadow:none;box-shadow:0 2px 7px #8a6a1e4d}

/* ---------- barre d'onglets dorée ---------- */
.tabs{display:flex;border-radius:14px;padding:4px;margin:22px 0 22px;
  background:linear-gradient(180deg,#D9B96A,#B8912F);border:1px solid #A8842F;
  box-shadow:0 3px 14px #8a6a1e4d, inset 0 1px 0 #FFF3D14d;overflow:visible}
.tab{flex:1;min-width:0;border:0;background:none;border-radius:11px;padding:11px 3px;
  font-family:var(--serif);font-size:calc((12px) * var(--ech));letter-spacing:.3px;color:#4C3A0E;
  text-shadow:0 1px 0 #FFF3D159;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#FFFEFA,#FDF8EC);color:#2E2745;
  font-weight:600;text-shadow:none;box-shadow:0 2px 8px #8a6a1e4d}
.tab:active{transform:scale(.97)}

/* ---------- la journée ---------- */
.grille{position:relative}
.ligne{display:grid;grid-template-columns:70px 1fr;gap:13px;align-items:start;margin-bottom:9px}
.ligne.libre{margin-bottom:6px}
.hcell{display:flex;align-items:flex-start;justify-content:flex-end;padding-top:16px;
  font-family:var(--serif);font-size:calc((16px) * var(--ech));letter-spacing:.5px;color:#FFFCEE;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 0 #FFFFFF59, 0 2px 4px #3E2F0B7a}
.ligne.libre .hcell{font-size:calc((14.5px) * var(--ech));opacity:.82;padding-top:11px}
.hcell button{border:0;background:none;padding:3px 7px;border-radius:8px;border:1px dashed transparent;
  color:#FFF6DC;font:inherit;font-variant-numeric:tabular-nums;transition:.16s;text-shadow:inherit}
.hcell button:hover{border-color:#FFF6DC8c;background:#FFFBEE26}
.ligne.ouvert .hcell{opacity:.76}
.libre{border:1px dashed var(--trait-or);border-radius:15px;padding:11px 17px;background:#FFFBEE14;
  font-family:var(--serif);font-style:italic;font-size:calc((14.5px) * var(--ech));color:#FFFBEE;width:100%;text-align:left;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);text-shadow:0 1px 2px #3E2F0B59;transition:.18s}
.libre:hover{background:#FFFBEE2e;border-color:#FFF6DCAA}
.libre:active{transform:scale(.99)}
.libre.ouvert{color:#FFFBEEB8;font-size:calc((14px) * var(--ech))}

.rdvbloc{border-radius:19px;padding:1px;margin:0;transition:.2s;
  background:linear-gradient(158deg,#FFFDF2,#FFFFFF 36%,#C9A54B 72%,#A8842F);box-shadow:var(--ombre)}
.rdvbloc>*{position:relative}
.rdvbloc .tete,.rdvbloc .cardacts{margin:0}
.rdvbloc{display:block}
.int{border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,var(--ivoire),var(--creme))}
.rdvbloc.fait{background:linear-gradient(158deg,#F7F2E4,#FFFDF6 36%,#D9C898 72%,#BFA36A);box-shadow:0 6px 20px #3E2F0B30}
.rdvbloc.fait .int{background:linear-gradient(180deg,#FAF8F3,#F4F1EA)}
.rdvbloc.fait .who{color:#6C7F9E}
.rdvbloc.fait .meta,.rdvbloc.fait .cardnote,.rdvbloc.fait .profilbloc{color:#8396AE}
.rdvbloc.fait .who,.rdvbloc.fait .meta,.rdvbloc.fait .cardnote,.rdvbloc.fait .profilbloc{text-decoration:line-through}
.who{font-family:var(--serif);font-size:calc((22px) * var(--ech));font-weight:500;line-height:1.2;letter-spacing:-.008em;color:var(--bleu)}
.meta{color:var(--bleu3);font-size:calc((12.5px) * var(--ech));margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cardnote{margin-top:10px;font-family:var(--serif);font-style:italic;font-size:calc((14.5px) * var(--ech));color:var(--bleu4);
  white-space:pre-wrap;line-height:1.55}
.profilbloc{margin-top:9px;font-family:var(--serif);font-style:italic;font-size:calc((13.5px) * var(--ech));color:var(--or);
  white-space:pre-wrap;line-height:1.5;box-shadow:inset 2px 0 0 #E8D7A8;padding-left:11px}
.cardacts{display:flex;gap:17px;margin-top:13px;padding-top:11px;border-top:1px solid var(--ligne);flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;font-family:var(--serif);font-size:calc((9.5px) * var(--ech));letter-spacing:2.5px;
  text-transform:uppercase;color:var(--bleu5);transition:.16s}
.linkbtn:hover{color:var(--bleu)}
.linkbtn.danger:hover{color:#A33B3B}
.coche{width:23px;height:23px;flex:none;border:1px solid var(--or-vif);border-radius:50%;margin-top:3px;
  display:grid;place-items:center;color:var(--or);font-size:calc((11px) * var(--ech));background:#FFFDF6;transition:.16s}
.coche:hover{background:var(--or-fond)}
.coche.v{border-color:var(--violet);color:var(--violet)}
.tete{display:flex;gap:13px;align-items:flex-start}

.ouvertbloc{border-radius:19px;padding:1px;margin:0;
  background:linear-gradient(158deg,#E7DFF4,#FFFFFFAA 40%,#A596C6);box-shadow:var(--ombre)}
.ouvertbloc .int{background:linear-gradient(180deg,#F7F4FC,#F1EDF7)}
.ouvertbloc .otexte{white-space:pre-wrap;font-family:var(--serif);font-size:calc((14.5px) * var(--ech));color:#473C6B;
  flex:1;min-width:0;line-height:1.55}
.ouvertbloc.fait .otexte{text-decoration:line-through;opacity:.62}

/* ---------- formations ---------- */
.formbloc{border-radius:19px;padding:1px;margin-bottom:11px;
  background:linear-gradient(158deg,#F7DCEC,#FFFFFFAA 40%,#C97BA8);box-shadow:var(--ombre)}
.formbloc .int{border-radius:18px;padding:16px 18px;background:linear-gradient(180deg,#FFFBFD,#FBE7F3)}
.formbloc>.formtitre,.formbloc>.meta,.formbloc>.partscount,.formbloc>.parts,.formbloc>.cardnote,.formbloc>.cardacts{padding:0 18px}
.formbloc>.formtitre{padding-top:16px}
.formbloc>.cardacts{padding-bottom:16px}
.formtitre{font-family:var(--serif);font-size:calc((21px) * var(--ech));font-weight:500;color:var(--fuchsia);letter-spacing:-.01em}
.parts{display:flex;flex-direction:column;gap:0;margin-top:12px;border-top:1px solid var(--fuchsia-clair)}
.pchip{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--fuchsia-clair);font-size:calc((13.5px) * var(--ech))}
.pchip:last-child{border-bottom:0}
.pchip::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--fuchsia);flex:none;opacity:.55}
.pchip span{flex:1;min-width:0}
.pchip button{border:0;background:none;padding:0 4px;color:var(--bleu5);font-size:calc((15px) * var(--ech));line-height:1}
.pchip button:hover{color:var(--fuchsia)}
.pchip .pnom{flex:1;min-width:0;text-align:left;font-size:calc((13.5px) * var(--ech));color:var(--bleu);padding:0}
.pchip .pnom:hover{color:var(--fuchsia);text-decoration:underline;text-underline-offset:3px}
.pchip input{flex:1;min-width:0;border:1px solid var(--fuchsia-clair);border-radius:9px;padding:7px 11px;background:#fff;font-size:calc((13.5px) * var(--ech))}
.pchip input:focus{outline:2px solid var(--fuchsia);outline-offset:-1px;border-color:transparent}
.partscount{font-family:var(--serif);font-size:calc((9.5px) * var(--ech));letter-spacing:3.2px;text-transform:uppercase;
  color:var(--fuchsia);margin:15px 0 0}

/* ---------- la semaine ---------- */
.sem{border-top:1px solid var(--trait-or2)}
.jrow{display:grid;grid-template-columns:82px 1fr;gap:13px;padding:13px 0;border-bottom:1px solid var(--trait-or2);align-items:start}
.jrow:last-child{border-bottom:0}
.jrow.auj{background:linear-gradient(90deg,#FFFBEE26,transparent 72%);margin:0 -12px;padding:13px 12px;border-radius:12px}
.jnom{border:0;background:none;padding:0;text-align:left;font-family:var(--serif);font-size:calc((10px) * var(--ech));
  color:#FFF6DCC4;line-height:1.3;letter-spacing:2.4px;text-transform:uppercase;text-shadow:0 1px 2px #3E2F0B59}
.jnom b{display:block;font-family:var(--serif);font-size:calc((24px) * var(--ech));color:#FFFCEE;font-weight:500;
  letter-spacing:-.02em;text-transform:none;margin:2px 0;text-shadow:0 1px 0 #FFFFFF4d, 0 2px 4px #3E2F0B7a}
.jcorps{display:flex;flex-wrap:wrap;gap:7px;padding-top:4px}
.chip{border-radius:30px;padding:7px 15px;font-size:calc((13px) * var(--ech));border:1px solid transparent;text-align:left;transition:.18s}
.chip.occ{background:linear-gradient(180deg,#FFFEFA,#FDF8EC);color:var(--bleu);box-shadow:0 2px 8px #3E2F0B3d}
.chip.occ:active{transform:scale(.97)}
.chip.occ.fait{text-decoration:line-through;opacity:.62}
.chip.occ b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--or)}
.chip.libre2{background:#FFFBEE14;border:1px dashed var(--trait-or);color:#FFFBEED1;
  font-family:var(--serif);font-style:italic;text-shadow:0 1px 2px #3E2F0B59}
.chip.libre2:hover{background:#FFFBEE2e}
.chip.forma{background:linear-gradient(180deg,#FFFBFD,#FBE7F3);border:1px solid var(--fuchsia-clair);
  color:var(--fuchsia);font-weight:500;box-shadow:0 2px 8px #3E2F0B30}

/* ---------- état vide ---------- */
.empty{border:1px dashed var(--trait-or);border-radius:var(--radius);padding:34px 24px;text-align:center;
  color:#FFFBEED9;font-family:var(--serif);font-style:italic;font-size:calc((15px) * var(--ech));background:#FFFBEE14;
  line-height:1.6;text-shadow:0 1px 2px #3E2F0B59;backdrop-filter:blur(2px)}
.empty strong{display:block;color:#FFFCEE;font-family:var(--serif);font-size:calc((20px) * var(--ech));font-weight:500;
  font-style:normal;margin-bottom:8px;letter-spacing:-.01em}

/* ---------- boutons ---------- */
.primary{background:linear-gradient(180deg,#2E2745,#15101F);color:var(--or-pale);border:0;border-radius:30px;
  padding:15px 26px;font-family:var(--serif);font-size:calc((11px) * var(--ech));letter-spacing:3px;text-transform:uppercase;
  box-shadow:0 4px 18px #2a223566, inset 0 1px 0 #ffffff1f;transition:.18s}
.primary:active{transform:scale(.97)}
.gold{background:linear-gradient(180deg,#FFFBFD,#FBE7F3);color:var(--fuchsia);border:1px solid var(--fuchsia-clair);
  border-radius:30px;padding:15px 26px;font-family:var(--serif);font-size:calc((11px) * var(--ech));letter-spacing:3px;
  text-transform:uppercase;box-shadow:0 3px 14px #3E2F0B33;transition:.18s}
.gold:active{transform:scale(.97)}
.ghost{background:#FFFBEE26;border:1px solid var(--trait-or);border-radius:30px;padding:13px 22px;
  font-family:var(--serif);font-size:calc((10.5px) * var(--ech));letter-spacing:2.5px;text-transform:uppercase;color:#FFFCEE;
  backdrop-filter:blur(4px);text-shadow:0 1px 2px #3E2F0B59;transition:.18s}
.ghost:hover{background:#FFFBEE3d}
.ghost:active{transform:scale(.97)}
.addrow{margin-top:26px;display:flex;gap:11px;flex-wrap:wrap;justify-content:center}

/* ---------- personnes ---------- */
.search{width:100%;background:#FFFBEE26;border:1px solid var(--trait-or);border-radius:30px;
  padding:13px 20px;margin-bottom:16px;color:#FFFEFA;backdrop-filter:blur(4px);
  font-family:var(--serif);font-size:calc((14.5px) * var(--ech))}
.search::placeholder{color:#FFF6DCA6;font-style:italic}
.search:focus{outline:2px solid var(--or-clair);outline-offset:1px;border-color:transparent;background:#FFFBEE3d}
.person{border-radius:19px;padding:1px;margin-bottom:10px;
  background:linear-gradient(158deg,#FFFDF2,#FFFFFFAA 38%,#C9A54B 74%,#A8842F);box-shadow:var(--ombre)}
.phead{width:100%;display:flex;align-items:baseline;gap:12px;padding:15px 18px;border:0;
  background:linear-gradient(180deg,var(--ivoire),var(--creme));text-align:left;border-radius:18px}
.person.ouv .phead{border-radius:18px 18px 0 0}
.pname{font-family:var(--serif);font-size:calc((19px) * var(--ech));font-weight:500;flex:1;min-width:0;letter-spacing:-.01em;color:var(--bleu)}
.pcount{color:var(--bleu3);font-family:var(--serif);font-size:calc((10px) * var(--ech));letter-spacing:2px;text-transform:uppercase;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.person .pbody{padding:16px 18px 18px;background:var(--creme);border-top:1px solid var(--ligne-fine);border-radius:0 0 18px 18px}
.next{background:linear-gradient(180deg,#FFFDF2,#FBF4E1);border:1px solid #E8D7A8;border-radius:12px;
  padding:12px 15px;font-size:calc((13.5px) * var(--ech));margin-bottom:16px;box-shadow:inset 0 1px 0 #ffffffaa}
.next b{display:block;font-family:var(--serif);font-weight:600;color:var(--or);letter-spacing:.01em;font-size:calc((13px) * var(--ech))}
.next span{color:var(--bleu4);display:block;margin-top:4px;white-space:pre-wrap;line-height:1.5;
  font-family:var(--serif);font-style:italic}
.sectitle{font-family:var(--serif);font-size:calc((9.5px) * var(--ech));letter-spacing:3.4px;text-transform:uppercase;
  color:var(--or);margin:20px 0 8px}
.histo{list-style:none;margin:0;padding:0}
.histo li{border-bottom:1px solid var(--ligne-fine)}
.histo li:last-child{border-bottom:0}
.histline{width:100%;display:flex;gap:12px;align-items:baseline;padding:11px 0;border:0;background:none;
  text-align:left;font-size:calc((13.5px) * var(--ech));transition:.16s}
.histline:active{opacity:.6}
.histline time{font-variant-numeric:tabular-nums;color:var(--bleu3);white-space:nowrap;font-size:calc((12.5px) * var(--ech));
  font-family:var(--serif);letter-spacing:.3px}
.histline span{flex:1;min-width:0;color:var(--bleu4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histline em{font-style:normal;color:var(--or);font-size:calc((14px) * var(--ech));line-height:1}
.histline .tag{flex:none;color:var(--fuchsia);font-family:var(--serif);font-size:calc((9px) * var(--ech));letter-spacing:2.4px}
.crbox{padding:4px 0 15px}
.crbox label{display:block;font-family:var(--serif);font-size:calc((9.5px) * var(--ech));letter-spacing:3px;text-transform:uppercase;
  color:var(--bleu3);margin-bottom:7px}
.crbox textarea,.crbox select{width:100%;border:1px solid var(--ligne);border-radius:12px;padding:12px 14px;
  background:#fff;color:var(--bleu);font-size:calc((14.5px) * var(--ech))}
.crbox textarea{resize:vertical;min-height:108px;line-height:1.55;font-family:var(--serif)}
.crbox select{margin-bottom:10px}
.crbox textarea:focus,.crbox select:focus{outline:2px solid var(--or-vif);outline-offset:-1px;border-color:transparent}
.crhint{font-size:calc((11.5px) * var(--ech));color:var(--bleu5);margin:7px 0 0;line-height:1.5}
.pacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.pacts .ghost{background:#FFFDF8;color:var(--bleu);border-color:var(--ligne);text-shadow:none;backdrop-filter:none}
.pacts .ghost:hover{border-color:var(--or-vif);color:var(--or)}

/* ---------- réglages ---------- */
.protos{border-radius:19px;padding:1px;max-width:560px;
  background:linear-gradient(158deg,#FFFDF2,#FFFFFFAA 38%,#C9A54B 74%,#A8842F);box-shadow:var(--ombre)}
.protos{overflow:hidden}
.proto{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--ivoire);
  border-bottom:1px solid var(--ligne-fine)}
.proto:first-child{border-radius:18px 18px 0 0}
.proto:last-child{border-bottom:0;border-radius:0 0 18px 18px}
.proto span{flex:1;min-width:0;font-family:var(--serif);font-size:calc((15px) * var(--ech));color:var(--bleu)}
#view>.meta,#view>p.meta{color:#FFFBEED1;text-shadow:0 1px 2px #3E2F0B59}

/* ---------- fiche technique ---------- */
.sheet.fiche{max-width:600px}
.fichetete{display:flex;align-items:flex-start;gap:14px}
.fichetete h2{font-size:calc((26px) * var(--ech));letter-spacing:-.015em}
.reperes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
.repere{background:linear-gradient(180deg,#FFFDF2,#FBF4E1);border:1px solid #E8D7A8;border-radius:12px;
  padding:11px 14px;box-shadow:inset 0 1px 0 #ffffffaa}
.repere span{display:block;font-family:var(--serif);font-size:calc((9.5px) * var(--ech));color:var(--bleu3);letter-spacing:2.4px;text-transform:uppercase}
.repere b{font-family:var(--serif);font-size:calc((22px) * var(--ech));font-weight:500;color:var(--or);font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;display:block;margin-top:3px}
.seance{border-top:1px solid var(--ligne-fine);padding:14px 0}
.seance textarea,.seance select{width:100%;border:1px solid var(--ligne);border-radius:12px;padding:11px 13px;
  background:#fff;color:var(--bleu);font-size:calc((14.5px) * var(--ech))}
.seance textarea{resize:vertical;min-height:72px;line-height:1.55;font-family:var(--serif)}
.seance textarea:focus,.seance select:focus,.sheet.fiche #fp:focus{outline:2px solid var(--or-vif);outline-offset:-1px;border-color:transparent}

/* ---------- pense-bête ---------- */
.notebox{border-radius:19px;padding:1px;margin-bottom:18px;
  background:linear-gradient(158deg,#FFFDF2,#FFFFFFAA 38%,#C9A54B 74%,#A8842F);box-shadow:var(--ombre)}
.notebox{overflow:hidden}
.notebox textarea{width:100%;border:0;background:var(--ivoire);resize:vertical;min-height:76px;outline:none;
  line-height:1.6;padding:15px 17px;font-family:var(--serif);font-size:calc((15px) * var(--ech));color:var(--bleu);display:block}
.notebox textarea::placeholder{color:var(--bleu5);font-style:italic}
.notebox>div{background:var(--creme);padding:10px 14px 14px;display:flex;justify-content:flex-end}
.noteitem{border-radius:19px;padding:1px;margin-bottom:10px;
  background:linear-gradient(158deg,#FFFDF2,#FFFFFFAA 38%,#C9A54B 74%,#A8842F);box-shadow:var(--ombre);
  display:flex;gap:0;align-items:stretch}
.noteitem{display:block}
.noteitem>.check,.noteitem>.notetext{display:none}
.noteitem.done{background:linear-gradient(158deg,#F7F2E4,#FFFDF6 36%,#D9C898 72%,#BFA36A);box-shadow:0 6px 20px #3E2F0B30}
.check{flex:none;width:22px;height:22px;margin-top:2px;border:1px solid var(--or-vif);border-radius:50%;
  background:#FFFDF6;display:grid;place-items:center;font-size:calc((11px) * var(--ech));color:var(--or);line-height:1}
.notetext{flex:1;white-space:pre-wrap;font-family:var(--serif);font-size:calc((15px) * var(--ech));line-height:1.6;min-width:0;
  word-break:break-word;color:var(--bleu)}
.noteitem.done .notetext{text-decoration:line-through;color:var(--bleu5)}
.notedate{display:block;font-family:var(--serif);font-size:calc((10px) * var(--ech));color:var(--bleu5);margin-top:9px;letter-spacing:1.6px}

/* ---------- fenêtres ---------- */
.overlay{position:fixed;inset:0;background:rgba(42,32,8,.5);display:flex;align-items:flex-end;
  justify-content:center;z-index:50;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
@media(min-width:600px){.overlay{align-items:center;padding:24px}}
.sheet{background:linear-gradient(180deg,var(--ivoire),var(--creme));width:100%;max-width:500px;
  max-height:92vh;overflow-y:auto;overflow-x:hidden;border-radius:22px 22px 0 0;
  padding:26px 24px calc(26px + env(safe-area-inset-bottom));box-shadow:var(--ombre-haute);
  border-top:1px solid #FFFDF2}
@media(min-width:600px){.sheet{border-radius:20px;border:1px solid #FFFDF2;padding-bottom:26px}}
.sheet h2{font-size:calc((24px) * var(--ech));margin:0 0 6px;letter-spacing:-.015em;color:var(--bleu)}
.sheet .sur{font-family:var(--serif);font-size:calc((9.5px) * var(--ech));letter-spacing:3.4px;text-transform:uppercase;
  color:var(--or);margin:0 0 18px}
.field{margin-bottom:15px;position:relative}
.field label{display:block;font-family:var(--serif);font-size:calc((9.5px) * var(--ech));letter-spacing:3px;text-transform:uppercase;
  color:var(--bleu3);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--ligne);border-radius:12px;
  padding:12px 14px;background:#fff;color:var(--bleu);font-size:calc((15px) * var(--ech));transition:.16s}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--or-vif);outline-offset:-1px;border-color:transparent}
.field textarea{resize:vertical;min-height:74px;line-height:1.55;font-family:var(--serif)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.err{color:#A33B3B;font-size:calc((13px) * var(--ech));margin:0 0 14px;display:none;background:#FBEDEC;border-radius:10px;
  padding:11px 14px;line-height:1.5;border:1px solid #F0D8D6}
.sheetacts{display:flex;gap:11px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap;align-items:center}
.sheetacts .ghost{background:#FFFDF8;color:var(--bleu);border-color:var(--ligne);text-shadow:none;backdrop-filter:none}
.sheetacts .ghost:hover{border-color:var(--or-vif);color:var(--or)}
.inline{display:flex;gap:9px}
.inline input{flex:1}

/* suggestions du répertoire */
.sugg{position:absolute;left:0;right:0;top:100%;z-index:9;margin-top:5px;background:#fff;
  border:1px solid var(--or-clair);border-radius:12px;box-shadow:0 10px 28px #2a200833;overflow:hidden;max-height:230px;overflow-y:auto}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;
  border-bottom:1px solid var(--ligne-fine);font-size:calc((14.5px) * var(--ech));color:var(--bleu)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button:focus{background:var(--or-fond)}
.sugg button i{display:block;font-style:normal;font-size:calc((11.5px) * var(--ech));color:var(--bleu3);margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- calendrier ---------- */
.calsheet{max-width:420px;padding-left:20px;padding-right:20px}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:16px}
.calnav .mois{font-family:var(--serif);font-size:calc((19px) * var(--ech));text-align:center;flex:1;min-width:0;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--bleu)}
.calnav .mois button{border:0;background:none;padding:0;font:inherit;color:inherit}
.calnav>button{width:33px;height:33px;border:1px solid var(--ligne);background:#FFFDF8;border-radius:10px;
  color:var(--bleu3);font-size:calc((13px) * var(--ech));flex:none;transition:.16s}
.calnav>button:hover{border-color:var(--or-vif);color:var(--or)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;width:100%}
.caldow{font-family:var(--serif);font-size:calc((9.5px) * var(--ech));letter-spacing:1.6px;text-transform:uppercase;color:var(--bleu5);
  text-align:center;padding-bottom:7px}
.cell{aspect-ratio:1;min-width:0;overflow:hidden;border:1px solid transparent;background:none;border-radius:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:1px;
  position:relative;transition:.14s;color:var(--bleu)}
.cell:hover{background:var(--or-fond)}
.cell .n{font-size:calc((14px) * var(--ech));font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cell.vide{visibility:hidden}
.cell.auj{border-color:var(--bleu)}
.cell.calme{background:#39FF6A;border-color:#39FF6A;box-shadow:0 0 7px rgba(57,255,106,.65)}
.cell.moyen{background:#FF9F1A;border-color:#FF9F1A;box-shadow:0 0 7px rgba(255,159,26,.7)}
.cell.charge{background:#FF2D55;border-color:#FF2D55;box-shadow:0 0 8px rgba(255,45,85,.7)}
.cell.forma{background:#FF29C3;border-color:#FF29C3;box-shadow:0 0 8px rgba(255,41,195,.7)}
.cell.calme .n{color:#08331A;font-weight:700}
.cell.moyen .n,.cell.charge .n,.cell.forma .n{color:#fff;font-weight:700}
.cell.calme .lune{color:#08331A}
.cell.moyen .lune,.cell.charge .lune,.cell.forma .lune{color:#fff}
.cell.sel,.cell.sel.calme,.cell.sel.moyen,.cell.sel.charge,.cell.sel.forma{
  background:linear-gradient(180deg,#2E2745,#15101F);border-color:#15101F;
  box-shadow:inset 0 0 0 2px var(--or-pale);filter:none}
.cell.sel .n,.cell.sel.calme .n,.cell.sel.moyen .n,.cell.sel.charge .n,.cell.sel.forma .n{color:var(--or-pale)}
.cell.sel .lune,.cell.sel.calme .lune{color:var(--or-pale)}
.cell .lune{font-family:var(--serif);font-size:calc((8px) * var(--ech));letter-spacing:.3px;color:var(--or);display:flex;
  align-items:center;gap:2px;line-height:1;max-width:100%}
.cell .lune svg{display:block}
.callegende{display:flex;gap:13px;flex-wrap:wrap;margin-top:18px;font-family:var(--serif);font-size:calc((10.5px) * var(--ech));
  color:var(--bleu3);letter-spacing:.3px}
.callegende span{display:flex;align-items:center;gap:6px}
.callegende i{width:11px;height:11px;border-radius:4px;display:block;border:0}
.callegende i.v{background:#39FF6A;box-shadow:0 0 5px rgba(57,255,106,.7)}
.callegende i.o{background:#FF9F1A;box-shadow:0 0 5px rgba(255,159,26,.7)}
.callegende i.r{background:#FF2D55;box-shadow:0 0 5px rgba(255,45,85,.7)}
.callegende i.f{background:#FF29C3;box-shadow:0 0 5px rgba(255,41,195,.7)}

/* ---------- vue année ---------- */
.calsheet.an{max-width:640px}
.annee{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:11px}
.mini{border:1px solid var(--ligne);border-radius:13px;padding:9px 9px 10px;background:#FFFDF8}
.mini h4{font-family:var(--serif);font-weight:500;font-size:calc((13.5px) * var(--ech));text-align:center;margin:0 0 8px;color:var(--or)}
.mini h4 button{border:0;background:none;padding:0;font:inherit;color:inherit}
.mini h4 button:hover{color:var(--or-vif);text-decoration:underline;text-underline-offset:3px}
.minigrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1.5px}
.mc{aspect-ratio:1;min-width:0;font-size:calc((8.5px) * var(--ech));line-height:1;display:grid;place-items:center;border:0;
  border-radius:3px;background:none;color:var(--bleu5);padding:0;font-variant-numeric:tabular-nums}
.mc.vide{visibility:hidden}
.mc.calme{background:#39FF6A;color:#08331A;font-weight:700}
.mc.moyen{background:#FF9F1A;color:#fff;font-weight:700}
.mc.charge{background:#FF2D55;color:#fff;font-weight:700}
.mc.forma{background:#FF29C3;color:#fff;font-weight:700}
.mc.auj{box-shadow:inset 0 0 0 1.5px var(--bleu)}

/* ---------- pied ---------- */
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--trait-or2);display:flex;gap:18px;
  justify-content:center;flex-wrap:wrap;align-items:center}
footer .linkbtn{font-family:var(--serif);font-size:calc((9.5px) * var(--ech));letter-spacing:2.4px;text-transform:uppercase;
  color:#FFFBEED1;text-shadow:0 1px 2px #3E2F0B59}
footer .linkbtn:hover{color:#FFFEFA}
footer span{color:#FFFBEEC4;font-family:var(--serif);font-size:calc((10px) * var(--ech));letter-spacing:1.6px;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #3E2F0B59}

:focus-visible{outline:2px solid var(--or-clair);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:420px){
  .wrap{padding-left:14px;padding-right:14px}
  .ligne{grid-template-columns:58px 1fr;gap:10px}
  .tab{font-size:calc((11px) * var(--ech));letter-spacing:0;padding:11px 2px}
  .sheet{padding-left:18px;padding-right:18px}
}

#alerte-onglets{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:80;
  display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#2E2745,#15101F);color:#F3E3B8;
  border:1px solid #C9A54B88;border-radius:14px;padding:13px 15px;font-size:calc((13.5px) * var(--ech));line-height:1.4;
  box-shadow:0 8px 28px #2a200866;max-width:620px;margin:0 auto}
#alerte-onglets span{flex:1}
#alerte-onglets button{border:0;background:none;color:#F3E3B8;font-size:calc((20px) * var(--ech));line-height:1;padding:0 4px}

/* ---------- glissement entre onglets ---------- */
#view,#head{animation:entre .22s ease-out}
@keyframes entre{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.glisse-g #view{animation:glg .24s ease-out}
.glisse-d #view{animation:gld .24s ease-out}
@keyframes glg{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes gld{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

/* ================= mise a jour : ecriture, bandeau, parchemin ================= */
:root{--serif:'Ecriture','Lora',Georgia,cursive;--chiffres:'Lora',Georgia,serif;--noir:#16120A}

/* --- le fond garde son grain --- */
#fond::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23g)' opacity='.19'/></svg>")}

/* --- chiffres et capitales : on garde une serif lisible --- */
.hcell,.hcell button,.meta,#view>.meta,#view>p.meta,.jcell .h,.cell .n,.caldow,
input,select,textarea,.search,.histdate,.pcount small,small{font-family:var(--chiffres)}

/* --- l'en-tete : bandeau de nuit doree --- */
.marque{position:relative;padding:26px 0 4px}
#head{position:relative;padding-bottom:34px;margin-bottom:14px}
#head::before{content:'';position:absolute;inset:-130px -50vw 0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,#4C3A0Ee0 0%,#6B5316b8 54%,#8A6A1E52 84%,transparent 100%)}
#head::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,#FFE9A8 22%,#FFFDF2 50%,#FFE9A8 78%,transparent);
  box-shadow:0 0 14px #FFE9A88c}
.marque .nom{font-size:calc((13.5px) * var(--ech));letter-spacing:6px;color:#FFF3D6;
  text-shadow:0 0 12px #FFE9A87a,0 1px 3px #00000080}
.datebtn{font-size:calc((clamp(30px,7.8vw,47px)) * var(--ech));letter-spacing:.004em;
  -webkit-text-stroke:1.3px currentColor;paint-order:stroke fill;
  background-image:linear-gradient(100deg,#FFF3CE,#FFFFFF 24%,#FFE9A8 46%,#FFFFFF 68%,#FFF0C6);
  filter:drop-shadow(0 0 34px #FFCF6ec4) drop-shadow(0 0 12px #FFF6DCb3) drop-shadow(0 5px 11px #000000bf)}
.daycount{color:#FFF8E6;font-size:calc((19px) * var(--ech));margin-top:14px;
  text-shadow:0 0 10px #FFE9A85c,0 1px 3px #0000006e}
#head .orne{color:#FFE9A8;gap:16px;margin-top:13px;opacity:.85}
#head .orne span{width:84px;height:1px;background:linear-gradient(90deg,transparent,#FFE9A8)}
#head .orne span+span,#head .orne span:last-child{background:linear-gradient(90deg,#FFE9A8,transparent)}
.datebar{margin-top:20px}
#head .arrow,#head .cal{color:#FFF6DC;border-color:#FFF3D1a6;background:#FFFBEE1a}
#head .arrow:hover,#head .cal:hover{background:#FFFBEE38;border-color:#FFF6DC}
#head .today-chip{color:#FFF6DC;border-color:#FFF3D1a6;background:#FFFBEE1f}
#head .switch{border-color:#FFF3D18c;background:#FFFBEE1a}
#head .switch button{color:#FFF6DC}
#head .switch button[aria-pressed="true"]{color:#2E2745}
#head .lunebadge{color:#FFFCEE;background:#FFFBEE33}

/* --- la barre d'onglets : laiton --- */
.tabs{border-radius:15px;padding:4.5px;margin:4px 0 24px;
  background:linear-gradient(177deg,#F3E2B4 0%,#DCBC6E 18%,#C09A3C 48%,#A8842F 70%,#D4B257 100%);
  border:1px solid #FFF0C4;
  box-shadow:0 5px 18px #3E2F0B45, inset 0 1px 0 #FFFDF2cc, inset 0 -1px 0 #6B531640}
.tab{color:#2E2745;text-shadow:0 1px 0 #FFF8E0a6}
.tab[aria-selected="true"]{box-shadow:0 2px 7px #3E2F0B3d, inset 0 1px 0 #FFFFFF}

/* --- tout ce qui est pose sur l'or : noir en relief --- */
.hcell,.hcell button,.libre,.libre.ouvert,.jnom,.jnom b,.jnom .lune7,.chip.libre2,
.empty,.empty strong,.sectitle,#view>.meta,#view>p.meta,.search,
footer .linkbtn,footer span,.jcell .h,.partscount{
  color:var(--noir);
  text-shadow:0 -1px 0 #FFFBEFcc, 0 1.5px 1px #4C3A0E73}
.search::placeholder{color:#16120A8c}
.hcell{font-size:calc((19px) * var(--ech));letter-spacing:.3px;min-width:0}
/* la colonne des heures suit la taille du texte, et rien ne deborde en largeur */
.ligne{grid-template-columns:calc(80px * var(--ech)) minmax(0,1fr);gap:13px;margin-bottom:11px}
.ligne>*{min-width:0}
.rdvbloc,.libre,.int,.who,.cardnote,.profilbloc,.meta{min-width:0;overflow-wrap:anywhere}
.wrap,body{overflow-x:hidden}
.ligne.libre{margin-bottom:8px}
.ligne.libre .hcell{font-size:calc((16.5px) * var(--ech))}

/* lignes libres : filet continu */
.libre{font-family:var(--serif);font-style:normal;font-size:calc((19px) * var(--ech));
  border:1px solid #6B53162e;border-radius:16px;padding:12px 18px;
  background:linear-gradient(104deg,#FFFBEE1c,#FFFDF60a);
  box-shadow:inset 0 1px 0 #FFFBEE38}
.libre:hover{background:linear-gradient(104deg,#FFFDF66e,#FFFEFA3d);border-color:#6B5316a6}
.libre.ouvert{font-size:calc((17px) * var(--ech));color:#16120Ac4}

/* --- les fiches : parchemin, double filet --- */
.rdvbloc,.person,.protos,.notebox,.noteitem,.formbloc{padding:1.5px;border-radius:20px;
  background:linear-gradient(152deg,#FFFBEC 0%,#E8CE8E 22%,#B8912F 54%,#8A6A1E 76%,#D9BC76 100%);
  box-shadow:0 14px 30px #3E2F0B3d, 0 3px 9px #3E2F0B2e, 0 1px 0 #FFF8E07a}
.rdvbloc>.int,.noteitem>.int{border-radius:18.5px;padding:19px 21px;
  background:linear-gradient(104deg,#E3CC90 0%,#FEFAEF 78%,#FEFAEF 100%);
  box-shadow:inset 0 0 0 1px #FFFDF5b3, inset 0 1px 0 #FFFFFF}
.rdvbloc:active{transform:scale(.995)}

/* personnes, protocoles, pense-bete : meme parchemin */

.cardacts{border-top:1px solid #16120A1f;padding-top:13px;margin-top:15px;gap:19px}
.who{font-size:calc((27px) * var(--ech));letter-spacing:0;line-height:1.25}
.cardnote{font-style:normal;font-size:calc((18px) * var(--ech))}

/* la puce */
.coche{width:21px;height:21px;border:1.5px solid #B8912F;
  box-shadow:inset 0 0 0 2px #FFFDF2,0 1px 2px #3E2F0B26}

/* --- rendez-vous honore : eteint, pas d'une autre application --- */
.rdvbloc.fait{background:linear-gradient(152deg,#F3E6C6 0%,#D8BE7E 24%,#A8842F 58%,#8A6A1E 80%,#C8AC68 100%);
  box-shadow:0 8px 20px #3E2F0B2e, 0 2px 6px #3E2F0B24}
.rdvbloc.fait .int{background:linear-gradient(104deg,#DCC89C 0%,#F3ECDC 78%,#F3ECDC 100%)}
.rdvbloc.fait .who,.rdvbloc.fait .cardnote,.rdvbloc.fait .meta,.rdvbloc.fait .profilbloc{color:#16120A7a}
.rdvbloc.fait .who{text-decoration:line-through;text-decoration-color:#16120A66}
.rdvbloc.fait .coche{border-color:#8A6A1E;background:#8A6A1E;color:#FFFDF2}

/* --- vue semaine --- */
.jour7{margin-bottom:14px}
.jnom b{font-size:calc((24px) * var(--ech))}
.chip.libre2{background:#FFFBEE1c;border:1px solid #6B53162e;color:var(--noir)}

/* --- dimanche et ecrans vides --- */
.empty{background:linear-gradient(104deg,#FFFBEE1c,#FFFDF60a);border:1px solid #6B53162e;
  border-radius:18px;font-style:normal;font-size:calc((18px) * var(--ech));font-family:var(--serif)}
.empty strong{font-size:calc((23px) * var(--ech));margin-bottom:6px}

/* --- boutons principaux --- */
.primary{background:linear-gradient(180deg,#2E2745,#15101F);color:#FFEFC4;
  box-shadow:0 5px 16px #3E2F0B45, inset 0 1px 0 #FFFFFF1f}

  box-shadow:0 5px 16px #3E2F0B45, inset 0 1px 0 #FFFFFF2e}

/* --- champs --- */
.search{background:#FFFDF59e;border:1px solid #6B531640;color:var(--noir);
  box-shadow:inset 0 1px 0 #FFFFFF, 0 2px 6px #3E2F0B1f}

/* --- calendrier : on garde les couleurs de charge --- */
.caldow{color:#16120A8c;text-shadow:0 1px 0 #FFF6DC73}
.calgrille .cell{font-family:var(--chiffres)}
.cell .n{font-family:var(--chiffres)}

/* --- pied de page --- */
footer{border-top:1px solid #6B531633}
footer span,footer .linkbtn{font-size:calc((11px) * var(--ech))}

/* --- reglage de la taille du texte --- */
.echelle{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 4px}
.echelle button{font-family:var(--chiffres);font-size:calc((12px) * var(--ech));letter-spacing:1.6px;text-transform:uppercase;
  padding:9px 15px;border-radius:30px;border:1px solid #6B531647;background:#FFFBEE42;color:var(--noir);
  cursor:pointer;transition:.18s;text-shadow:0 1px 0 #FFF6DC8c}
.echelle button:hover{background:#FFFDF68c;border-color:#6B5316a6}
.echelle button[aria-pressed="true"]{background:linear-gradient(180deg,#FFFEFA,#FDF8EC);
  border-color:#B8912F;box-shadow:0 2px 8px #3E2F0B30;font-weight:600}

.caldow,.crbox label,.field label,.ghost,.gold,.jnom,.linkbtn,.marque .nom,.partscount,.pcount,.repere span,.sectitle,.sheet .sur,.switch button,.today-chip,/* ---------- boutons ---------- */ .primary,footer .linkbtn{font-family:var(--chiffres)}

</style>
</head>
<body>
<div id="fond"><div class="brosse"></div><div class="rais"></div></div>
<div class="wrap">
  <div class="marque"><div class="nom">Mon Cabinet</div></div>

  <div id="head"></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="jour" aria-selected="true">Journée</button>
    <button class="tab" role="tab" data-tab="gens" aria-selected="false">Personnes</button>
    <button class="tab" role="tab" data-tab="notes" aria-selected="false">Pense-bête</button>
    <button class="tab" role="tab" data-tab="reglages" aria-selected="false">Réglages</button>
  </nav>

  <main id="view"></main>

  <footer>
    <span id="stats"></span>
    <button class="linkbtn" id="export">Enregistrer une sauvegarde</button>
    <button class="linkbtn" id="importbtn">Restaurer une sauvegarde</button>
    <input type="file" id="importfile" accept="application/json" hidden>
  </footer>
</div>
<div id="modal"></div>

<script>
/* ============ constantes ============ */
const KEY = 'mon-cabinet-v1';
const MATIN = ['04:45','05:30','06:15','07:00','07:45','08:30','09:15','10:00','10:45','11:30','12:15','13:00','13:45','14:30'];
const APREM_DEFAUT = ['16:00','17:00','18:00','19:00'];
const PROTO_DEFAUT = ['Scanner','Soins énergétiques',"Loi d'attraction",'Régression','Soins occultes','Contact médiumnique','Mémoire transgénérationnelle','Voyance','Développement des perceptions'];

let data = { rdv:[], gens:{}, notes:[], formations:[], ouverts:{}, aprem:[...APREM_DEFAUT], protocoles:[...PROTO_DEFAUT] };
let supprimes=new Set(), gensSupprimes=new Set(), monEcriture=-1;
let onglet=(()=>{ try{ const v=sessionStorage.getItem('mc-onglet'); return ['jour','gens','notes','reglages'].includes(v)?v:'jour'; }catch(e){ return 'jour'; } })(),
    vue='jour', jour=isoToday(), recherche='', ouvert=null, ouvertCR=null, calMois=null, partTmp=[], saveTimer=null, ficheOuverte=null;

/* ============ dates ============ */
function isoToday(){ return iso(new Date()); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fromIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function decale(s,n){ const d=fromIso(s); d.setDate(d.getDate()+n); return iso(d); }
function lundiDe(s){ return decale(s, -((fromIso(s).getDay()+6)%7)); }
function estDimanche(s){ return fromIso(s).getDay()===0; }
function longDate(s){ return fromIso(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function courtDate(s){ return fromIso(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
function libelleSemaine(l){
  const a=fromIso(l), b=fromIso(decale(l,6)), mm=d=>d.toLocaleDateString('fr-FR',{month:'long'});
  return a.getMonth()===b.getMonth()
    ? a.getDate()+' – '+b.getDate()+' '+mm(b)+' '+b.getFullYear()
    : a.getDate()+' '+mm(a)+' – '+b.getDate()+' '+mm(b)+' '+b.getFullYear();
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cle(p,n){ return (p+' '+n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
function minutes(h){ const [a,b]=h.split(':').map(Number); return a*60+b; }
function hhmm(t){ return String(Math.floor(t/60)%24).padStart(2,'0')+'h'+String(t%60).padStart(2,'0'); }
function jolie(h){ return h.replace(':','h'); }
function duree(m){ const h=Math.floor(m/60), r=m%60; if(h&&r) return h+' h '+String(r).padStart(2,'0'); if(h) return h+' h'; return r+' min'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============ lunaisons (Meeus, termes principaux) ============ */
function phaseJD(k, frac){
  k = k + frac;
  const T=k/1236.85, R=Math.PI/180;
  let jde = 2451550.09766 + 29.530588861*k + 0.00015437*T*T - 0.000000150*T*T*T;
  const E = 1 - 0.002516*T - 0.0000074*T*T;
  const M  = (2.5534 + 29.10535670*k - 0.0000014*T*T)*R;
  const Mp = (201.5643 + 385.81693528*k + 0.0107582*T*T)*R;
  const F  = (160.7108 + 390.67050284*k - 0.0016118*T*T)*R;
  const O  = (124.7746 - 1.56375588*k + 0.0020672*T*T)*R;
  const s=Math.sin, pleine = frac===0.5;
  jde += (pleine?-0.40614:-0.40720)*s(Mp)
       + (pleine? 0.17302:0.17241)*E*s(M)
       + (pleine? 0.01614:0.01608)*s(2*Mp)
       + (pleine? 0.01043:0.01039)*s(2*F)
       + (pleine? 0.00734:0.00739)*E*s(Mp-M)
       - 0.00515*E*s(Mp+M) + 0.00209*E*E*s(2*M)
       - 0.00111*s(Mp-2*F) - 0.00057*s(Mp+2*F)
       + 0.00056*E*s(2*Mp+M) - 0.00042*s(3*Mp)
       + 0.00042*E*s(M+2*F) + 0.00038*E*s(M-2*F)
       - 0.00024*E*s(2*Mp-M) - 0.00017*s(O) - 0.00007*s(Mp+2*M);
  return jde;
}
function jdIso(jd){ return iso(new Date((jd-2440587.5)*86400000)); }
function lunes(debut, fin){
  const out={}, d=fromIso(debut);
  let k0 = Math.floor(((d.getFullYear()+d.getMonth()/12)-2000)*12.3685) - 2;
  for(let i=0;i<8;i++){
    const nl=jdIso(phaseJD(k0+i,0)), pl=jdIso(phaseJD(k0+i,0.5));
    if(nl>=debut&&nl<=fin) out[nl]='NL';
    if(pl>=debut&&pl<=fin) out[pl]='PL';
  }
  return out;
}
function luneDu(d){ return lunes(decale(d,-1),decale(d,1))[d]||null; }

/* ============ stockage ============ */
const CLE_HIST='mon-cabinet-historique';

function normaliser(p){
  return {
    rdv:p.rdv||[], gens:p.gens||{}, notes:p.notes||[], formations:p.formations||[],
    ouverts:p.ouverts||{}, aprem:(p.aprem&&p.aprem.length)?p.aprem:[...APREM_DEFAUT],
    protocoles:p.protocoles||[...PROTO_DEFAUT], ech:p.ech||1, v:p.v||0
  };
}
function lireBrut(){
  try{ const b=localStorage.getItem(KEY); return b?normaliser(JSON.parse(b)):null; }
  catch(e){ return null; }
}

/* fusionne deux états : rien ne peut être effacé par un onglet en retard */
function fusionner(mien, autre){
  if(!autre) return mien;
  const parId=(a,b)=>{
    const m=new Map();
    (b||[]).forEach(x=>m.set(x.id,x));
    (a||[]).forEach(x=>m.set(x.id,x));   // le mien gagne sur un même identifiant
    return [...m.values()];
  };
  const f={
    rdv: parId(mien.rdv, autre.rdv),
    formations: parId(mien.formations, autre.formations),
    notes: parId(mien.notes, autre.notes),
    gens: Object.assign({}, autre.gens||{}, mien.gens||{}),
    ouverts: Object.assign({}, autre.ouverts||{}, mien.ouverts||{}),
    aprem: mien.aprem, protocoles: mien.protocoles, ech: mien.ech||autre.ech||1,
    v: Math.max(mien.v||0, autre.v||0)+1
  };
  // ce que j'ai sciemment supprimé pendant cette session ne revient pas
  if(supprimes.size){
    f.rdv=f.rdv.filter(x=>!supprimes.has(x.id));
    f.formations=f.formations.filter(x=>!supprimes.has(x.id));
    f.notes=f.notes.filter(x=>!supprimes.has(x.id));
  }
  if(gensSupprimes.size){
    gensSupprimes.forEach(k=>{ delete f.gens[k]; });
    f.rdv=f.rdv.filter(x=>!gensSupprimes.has(x.cle));
  }
  return f;
}

/* garde les dix derniers états, pour pouvoir revenir en arrière */
function archiver(etat){
  try{
    const h=JSON.parse(localStorage.getItem(CLE_HIST)||'[]');
    const n={le:Date.now(), rdv:(etat.rdv||[]).length, etat:JSON.stringify(etat)};
    if(h.length && h[0].rdv===n.rdv && Date.now()-h[0].le < 900000) h[0]=n; else h.unshift(n);
    localStorage.setItem(CLE_HIST, JSON.stringify(h.slice(0,10)));
  }catch(e){}
}

async function charger(){
  const p=lireBrut();
  if(p) data=p;
  rendre();
}

function ecrire(){
  try{
    const f=fusionner(data, lireBrut());
    data=f;
    localStorage.setItem(KEY, JSON.stringify(f));
    archiver(f);
    monEcriture=f.v;
  }catch(e){ console.error('Enregistrement impossible', e); }
}
function sauver(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(ecrire,250);
}
/* enregistrer sans attendre, quand l'application passe en arrière-plan */
function sauverTout(){ clearTimeout(saveTimer); ecrire(); }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) sauverTout(); });
window.addEventListener('pagehide', sauverTout);

/* les onglets se tiennent au courant */
window.addEventListener('storage', e=>{
  if(e.key!==KEY || !e.newValue) return;
  try{
    const p=normaliser(JSON.parse(e.newValue));
    if(p.v===monEcriture) return;
    data=fusionner(p, data);
    monEcriture=data.v;
    if(!document.getElementById('modal').innerHTML) rendre();
  }catch(err){}
});

/* ============ sélecteurs ============ */
function grilleDu(){ return [...MATIN, ...data.aprem].sort((a,b)=>minutes(a)-minutes(b)); }
function rdvDuJour(d){ return data.rdv.filter(r=>r.date===d).sort((a,b)=>a.heure.localeCompare(b.heure)); }
function formsDuJour(d){ return data.formations.filter(f=>f.date<=d && (f.fin||f.date)>=d).sort((a,b)=>a.debut.localeCompare(b.debut)); }
function enFormation(d){ return formsDuJour(d).length>0; }
function rdvDe(k){ return data.rdv.filter(r=>r.cle===k); }
function formsDe(k){ return data.formations.filter(f=>(f.parts||[]).some(p=>p.cle===k)); }
function histoDe(k){
  const a = rdvDe(k).map(r=>({type:'rdv', date:r.date, heure:r.heure, id:r.id, r}));
  const b = formsDe(k).map(f=>({type:'form', date:f.date, heure:f.debut, id:f.id, f}));
  return [...a,...b].sort((x,y)=>(x.date+x.heure).localeCompare(y.date+y.heure));
}
function prochainDe(k){
  const t=isoToday();
  return rdvDe(k).filter(r=>r.date>=t).sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure))[0]||null;
}
function listeGens(){
  const q=cle(recherche,'');
  return Object.values(data.gens).map(p=>{
    const h=histoDe(p.cle);
    return {...p, nb:h.length, dernier:h.filter(x=>x.date<=isoToday()).pop()||null, prochain:prochainDe(p.cle)};
  }).filter(p=>!q||cle(p.prenom,p.nom).includes(q)||(p.tel||'').includes(recherche.trim()))
    .sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom,'fr'));
}

/* ============ rendu ============ */
const ICONE_CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';

function svgLune(t,px){
  const d=`width="${px}" height="${px}" viewBox="0 0 32 32"`;
  if(t==='PL') return `<svg ${d} aria-hidden="true" style="filter:drop-shadow(0 0 1px rgba(0,0,0,.35))"><defs><radialGradient id="pl" cx="38%" cy="34%"><stop offset="0" stop-color="#F6E4AE"/><stop offset="1" stop-color="#C9A54B"/></radialGradient></defs>
    <circle cx="16" cy="16" r="14" fill="url(#pl)"/>
    <circle cx="11" cy="11" r="3.4" fill="#B8933E" opacity=".38"/>
    <circle cx="21" cy="18" r="2.4" fill="#B8933E" opacity=".32"/>
    <circle cx="14" cy="22" r="1.7" fill="#B8933E" opacity=".28"/>
    <circle cx="22" cy="10" r="1.2" fill="#B8933E" opacity=".25"/></svg>`;
  return `<svg ${d} aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#241E36"/>
    <path d="M16 2a14 14 0 0 1 0 28A14 14 0 0 0 16 2Z" fill="#A8862F" opacity=".22"/>
    <circle cx="16" cy="16" r="13.2" fill="none" stroke="#C9A54B" stroke-width="1.3" opacity=".85"/></svg>`;
}
function badgeLune(t){
  if(!t) return '';
  return `<span class="lunebadge">${svgLune(t,24)}${t}</span>`;
}

const ORDRE=['jour','gens','notes','reglages'];
function anime(sens){
  const w=document.querySelector('.wrap');
  w.classList.remove('glisse-g','glisse-d'); void w.offsetWidth;
  w.classList.add(sens>0?'glisse-g':'glisse-d');
}
function appliquerEchelle(){
  const e = Number(data.ech)||1;
  document.documentElement.style.setProperty('--ech', e);
}
function rendre(){
  appliquerEchelle();
  try{ sessionStorage.setItem('mc-onglet', onglet); }catch(e){}
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===onglet));
  head();
  const v=document.getElementById('view');
  v.innerHTML = onglet==='jour' ? (vue==='jour'?vueJour():vueSemaine()) : onglet==='gens' ? vueGens() : onglet==='notes' ? vueNotes() : vueReglages();
  const n=Object.keys(data.gens).length;
  document.getElementById('stats').textContent =
    data.rdv.length+' rendez-vous · '+data.formations.length+' formation'+(data.formations.length>1?'s':'')+' · '+n+' personne'+(n>1?'s':'');
}

function head(){
  const h=document.getElementById('head');
  if(onglet!=='jour'){ h.innerHTML=''; return; }
  const sem = vue==='semaine', lundi=lundiDe(jour);
  const nJ = rdvDuJour(jour).length, nF = formsDuJour(jour).length;
  const nSem = data.rdv.filter(r=>r.date>=lundi&&r.date<=decale(lundi,6)).length;
  const memeSem = lundi===lundiDe(isoToday());
  const l = sem?null:luneDu(jour);
  h.innerHTML=`
    <button class="datebtn" id="pickbtn">${esc(sem?libelleSemaine(lundi):longDate(jour))}</button>
    <div class="orne"><span></span>✦<span></span></div>
    <p class="daycount">${sem
      ? (nSem===0?'Aucun rendez-vous cette semaine':nSem+' rendez-vous cette semaine')
      : (estDimanche(jour)
          ? (nF===0?'Dimanche · journée de formation':nF+' formation'+(nF>1?'s':''))
          : (nJ===0?'Journée libre':nJ+' rendez-vous'))+' '+badgeLune(l)}</p>
    <div class="datebar">
      <button class="arrow" id="prev" aria-label="Précédent">‹</button>
      <button class="cal" id="calbtn" aria-label="Ouvrir le calendrier">${ICONE_CAL}</button>
      <button class="arrow" id="next" aria-label="Suivant">›</button>
      ${(sem?!memeSem:jour!==isoToday())?'<button class="today-chip" id="today">Aujourd\'hui</button>':''}
    </div>
    <div class="switch">
      <button data-vue="jour" aria-pressed="${!sem}">Jour</button>
      <button data-vue="semaine" aria-pressed="${sem}">Semaine</button>
    </div>`;
}

function profilDe(k){ const p=data.gens[k]; return p&&p.note?p.note:''; }
function blocRdv(r){
  return `<div class="rdvbloc${r.fait?' fait':''}"><div class="int">
    <div class="tete">
      <button class="coche" data-fait="${r.id}" aria-label="${r.fait?'Rendez-vous honoré, décocher':'Marquer comme honoré'}">${r.fait?'✓':''}</button>
      <div style="flex:1;min-width:0">
        <div class="who">${esc(r.prenom)} ${esc(r.nom)}</div>
        ${r.tel?`<div class="meta">${esc(r.tel)}</div>`:''}
        ${profilDe(r.cle)?`<div class="profilbloc">${esc(profilDe(r.cle))}</div>`:''}

function vueJour(){
  const enForm=enFormation(jour);
  if(enForm || estDimanche(jour)){
    const fs=formsDuJour(jour);
    let html = fs.length ? '' : `<div class="empty"><strong>Dimanche</strong>Pas de rendez-vous ce jour. C'est la journée des formations et des stages.</div>`;
    fs.forEach(f=>{
      html += `<div class="formbloc"><div class="int">
        <div class="formtitre">${esc(f.titre)}</div>
        <div class="meta">${f.fin&&f.fin!==f.date?esc(longDate(f.date))+' → '+esc(longDate(f.fin)):esc(longDate(f.date))} · ${esc(jolie(f.debut))} – ${esc(jolie(f.finH||f.fin))}</div>
        ${(f.parts||[]).length?`<p class="partscount">${f.parts.length} participant${f.parts.length>1?'s':''}</p>
          <div class="parts">${f.parts.map(p=>`<div class="pchip"><span>${esc(p.nom)}</span></div>`).join('')}</div>`:''}
        ${f.notes?`<div class="cardnote">${esc(f.notes)}</div>`:''}
        <div class="cardacts">
          <button class="linkbtn" data-editf="${f.id}">Modifier</button>
          <button class="linkbtn danger" data-delf="${f.id}">Supprimer</button>
        </div></div></div>`;
    });
    return html + `<div class="addrow"><button class="gold" data-newf="1">Ajouter une formation</button></div>`;
  }

  const liste=rdvDuJour(jour), g=grilleDu();
  const pris={}; liste.forEach(r=>{ (pris[r.heure]=pris[r.heure]||[]).push(r); });
  const heures=[...new Set([...g, ...liste.map(r=>r.heure)])].sort((a,b)=>minutes(a)-minutes(b));
  let html='<div class="grille">';
  heures.forEach(h=>{
    const rs=pris[h]||[], modifiable=data.aprem.includes(h);
    const kO=jour+'|'+h;
    const vide = modifiable
      ? (data.ouverts[kO] ? blocOuvert(kO) : `<button class="libre ouvert" data-ouvrir="${kO}">temps ouvert — écrire une note</button>`)
      : `<button class="libre" data-slot="${jour}|${h}">libre — poser un rendez-vous</button>`;
    html += `<div class="ligne${rs.length?' pris':modifiable?' ouvert':''}">
      <div class="hcell">${modifiable?`<button data-hedit="${h}" title="Modifier cet horaire">${esc(jolie(h))}</button>`:esc(jolie(h))}</div>
      <div>${rs.length ? rs.map(blocRdv).join('') : vide}</div>
    </div>`;
  });
  return html+'</div><div class="addrow"><button class="primary" data-new="1">Nouveau rendez-vous</button><button class="gold" data-newf="1">Ajouter une formation</button></div>';
}

function vueSemaine(){
  const lundi=lundiDe(jour), auj=isoToday(), lun=lunes(lundi,decale(lundi,6));
  let html='<div class="sem">';
  for(let i=0;i<7;i++){
    const d=decale(lundi,i), l=rdvDuJour(d), fs=formsDuJour(d);
    const nom=fromIso(d).toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','');
    const mois=fromIso(d).toLocaleDateString('fr-FR',{month:'short'}).replace('.','');
    let corps='';
    if(fs.length || estDimanche(d)){
      fs.forEach(f=>{ corps+=`<button class="chip forma" data-editf="${f.id}">${esc(jolie(f.debut))} · ${esc(f.titre)}</button>`; });
      if(!fs.length) corps+=`<button class="chip libre2" data-gotof="${d}">formation ou stage</button>`;
    }else{
      l.forEach(r=>{ corps+=`<button class="chip occ${r.fait?' fait':''}" data-edit="${r.id}"><b>${esc(jolie(r.heure))}</b> · ${esc(r.prenom)} ${esc(r.nom)}</button>`; });
      const libres=MATIN.filter(h=>!l.some(r=>r.heure===h)).length;
      corps+=`<button class="chip libre2" data-goto="${d}">${libres} créneau${libres>1?'x':''} libre${libres>1?'s':''}</button>`;
    }

  return html+'</div>';
}

function selProto(id,val){
  const liste=[...data.protocoles];
  if(val && !liste.includes(val)) liste.unshift(val);
  return `<select data-proto="${id}"><option value="">— aucun protocole —</option>${
    liste.map(x=>`<option${x===val?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
}

function ficheTechnique(k){
  if(ficheOuverte!==k) pousser();
  ficheOuverte=k;
  const p=data.gens[k], h=histoDe(k), seances=h.filter(x=>x.type==='rdv'), forms=h.filter(x=>x.type==='form');
  const prem=seances[0], der=[...seances].reverse()[0], proch=prochainDe(k);
  let rythme='—';
  if(seances.length>1){
    const d1=fromIso(seances[0].date), d2=fromIso(seances[seances.length-1].date);
    const j=Math.round((d2-d1)/86400000/(seances.length-1));
    rythme = j>=14 ? Math.round(j/7)+' sem.' : j+' j';
  }
  const bloc=(l,v)=>`<div class="repere"><span>${l}</span><b>${v}</b></div>`;
  let html=`
  <div class="overlay" id="ov"><div class="sheet fiche" role="dialog" aria-modal="true">
    <div class="fichetete">
      <div><p class="sur" style="margin:0 0 4px">Fiche technique</p><h2 style="margin:0">${esc(p.prenom)} ${esc(p.nom)}</h2>
      ${p.tel?`<div class="meta">${esc(p.tel)}</div>`:''}</div>
      <button class="ghost" data-close="1">Fermer</button>
    </div>
    <div class="field" style="margin-top:14px"><label for="fp">Profil</label>
      <textarea id="fp" data-profilsave="${esc(k)}" placeholder="Ce qu'il faut avoir en tête">${esc(p.note||'')}</textarea></div>
    <div class="reperes">
      ${bloc('Séances', seances.length)}${bloc('Rythme moyen', rythme)}
      ${bloc('Première', prem?courtDate(prem.date):'—')}${bloc('Dernière', der?courtDate(der.date):'—')}
    </div>`;
  if(proch) html+=`<div class="next" style="margin-top:12px"><b>Prochaine · ${esc(longDate(proch.date))}, ${esc(jolie(proch.heure))}</b>${proch.note?`<span>${esc(proch.note)}</span>`:''}</div>`;
  html+=`<p class="sectitle">Séances</p>`;
  if(!seances.length) html+=`<p class="meta">Aucune séance enregistrée.</p>`;
  seances.forEach(x=>{
    const r=x.r;
    html+=`<div class="seance">
      <div class="meta">${esc(longDate(r.date))} · ${esc(jolie(r.heure))}</div>
      <div class="field" style="margin:7px 0 8px">${selProto(r.id, r.proto||'')}</div>
      <textarea data-crsave="${r.id}" placeholder="Notes libres sur cette séance">${esc(r.cr||'')}</textarea>
    </div>`;
  });
  if(forms.length){
    html+=`<p class="sectitle" style="color:var(--fuchsia)">Formations</p>`;
    forms.forEach(x=>html+=`<div class="formbloc" style="margin-bottom:8px"><div class="int"><div class="formtitre">${esc(x.f.titre)}</div><div class="meta">${x.f.fin&&x.f.fin!==x.f.date?esc(courtDate(x.f.date))+' → '+esc(courtDate(x.f.fin)):esc(longDate(x.f.date))} · ${esc(jolie(x.f.debut))} – ${esc(jolie(x.f.finH||x.f.fin))}</div></div></div>`);
  }
  html+=`<div class="sheetacts"><button class="ghost" data-close="1">Fermer</button></div></div></div>`;
  document.getElementById('modal').innerHTML=html;
}

/* ============ calendrier ============ */
let calVue='mois';
function ouvrirCal(){ pousser(); calVue='mois'; calMois=jour.slice(0,7); rendreCal(); }

function rendreCalAnnee(){
  const an=Number(calMois.slice(0,4)), auj=isoToday();
  let mois='';
  for(let m=1;m<=12;m++){
    const nb=new Date(an,m,0).getDate(), off=(new Date(an,m-1,1).getDay()+6)%7;
    const nom=new Date(an,m-1,1).toLocaleDateString('fr-FR',{month:'long'});
    let c='';
    for(let i=0;i<off;i++) c+='<span class="mc vide"></span>';
    for(let n=1;n<=nb;n++){
      const d=iso(new Date(an,m-1,n));
      const nr=rdvDuJour(d).length, nf=formsDuJour(d).length;
      const cl = nf?' forma' : nr>=10?' charge' : nr>=5?' moyen' : nr>0?' calme' : '';
      c+=`<button class="mc${cl}${d===auj?' auj':''}" data-day="${d}" title="${nr?nr+' rendez-vous':''}">${n}</button>`;
    }
    mois+=`<div class="mini"><h4><button data-calmois="${an}-${String(m).padStart(2,'0')}">${esc(nom)}</button></h4>
      <div class="minigrid">${c}</div></div>`;
  }
  document.getElementById('modal').innerHTML=`
  <div class="overlay" id="ov"><div class="sheet calsheet an" role="dialog" aria-modal="true">
    <p class="sur">Aller à une date</p>
    <div class="calnav">
      <button data-calan="-1" aria-label="Année précédente">‹</button>
      <div class="mois"><button data-calvue="mois" style="border:0;background:none;font:inherit;color:inherit;padding:0">${an}</button></div>
      <button data-calan="1" aria-label="Année suivante">›</button>
    </div>
    <div class="annee">${mois}</div>
    <div class="callegende">
      <span><i class="v"></i>moins de 5</span><span><i class="o"></i>5 à 9</span><span><i class="r"></i>10 et plus</span><span><i class="f"></i>formation</span>
    </div>
    <div class="sheetacts"><button class="ghost" data-close="1">Fermer</button></div>
  </div></div>`;
}
function rendreCal(){
  const [y,m]=calMois.split('-').map(Number);
  const nb=new Date(y,m,0).getDate(), off=(new Date(y,m-1,1).getDay()+6)%7;
  const debut=iso(new Date(y,m-1,1)), fin=iso(new Date(y,m,nb));
  const lu=lunes(debut,fin), auj=isoToday();
  const titre=new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  let cells='';
  ['lu','ma','me','je','ve','sa','di'].forEach(d=>cells+=`<div class="caldow">${d}</div>`);
  for(let i=0;i<off;i++) cells+='<div class="cell vide"></div>';
  for(let n=1;n<=nb;n++){
    const d=iso(new Date(y,m-1,n));
    const nr=rdvDuJour(d).length, nf=formsDuJour(d).length, l=lu[d];
    const charge = nr>=10?' charge' : nr>=5?' moyen' : nr>0?' calme' : '';
    cells+=`<button class="cell${d===auj?' auj':''}${d===jour?' sel':''}${nf?' forma':''}${charge}" data-day="${d}" title="${nr?nr+' rendez-vous':''}">
      <span class="n">${n}</span>
      ${l?`<span class="lune">${svgLune(l,11)}${l}</span>`:'<span class="lune">&nbsp;</span>'}</button>`;
  }
  document.getElementById('modal').innerHTML=`
  <div class="overlay" id="ov"><div class="sheet calsheet" role="dialog" aria-modal="true">
    <p class="sur">Aller à une date</p>
    <div class="calnav">
      <button data-cal="-12" aria-label="Année précédente">«</button>
      <button data-cal="-1" aria-label="Mois précédent">‹</button>
      <div class="mois"><button data-calvue="annee" style="border:0;background:none;font:inherit;color:inherit;padding:0">${esc(titre)}</button></div>
      <button data-cal="1" aria-label="Mois suivant">›</button>
      <button data-cal="12" aria-label="Année suivante">»</button>
    </div>
    <div class="calgrid">${cells}</div>
    <div class="callegende">
      <span><i class="v"></i>moins de 5</span><span><i class="o"></i>5 à 9</span><span><i class="r"></i>10 et plus</span><span><i class="f"></i>formation</span>
      <span>${svgLune('NL',11)}NL nouvelle lune</span>
      <span>${svgLune('PL',11)}PL pleine lune</span>
    </div>
    <div class="sheetacts"><button class="ghost" data-close="1">Fermer</button></div>
  </div></div>`;
}

/* ============ répertoire proposé ============ */
function chercherGens(t){
  const q=cle(t,'');
  if(q.length<1) return [];
  return Object.values(data.gens)
    .filter(p=>cle(p.prenom,p.nom).includes(q))
    .sort((a,b)=>(a.nom+a.prenom).localeCompare(b.nom+b.prenom,'fr'))
    .slice(0,6);
}
function suggerer(champ){
  const inp=document.getElementById('f_'+champ), boite=document.getElementById('sug_'+champ);
  if(!inp||!boite) return;
  const l=chercherGens(inp.value);
  if(!inp.value.trim() || !l.length){ boite.innerHTML=''; return; }
  boite.innerHTML=`<div class="sugg">${l.map(p=>
    `<button type="button" data-pick="${esc(p.cle)}">${esc(p.prenom)} ${esc(p.nom)}${p.tel?`<i>${esc(p.tel)}</i>`:''}</button>`).join('')}</div>`;
}
function choisirGens(k){
  const p=data.gens[k]; if(!p) return;
  const mettre=(id,v)=>{ const e=document.getElementById(id); if(e) e.value=v; };
  mettre('f_prenom',p.prenom); mettre('f_nom',p.nom);
  mettre('f_tel',p.tel||''); mettre('f_profil',p.note||'');
  const a=document.getElementById('sug_prenom'), b=document.getElementById('sug_nom');
  if(a) a.innerHTML=''; if(b) b.innerHTML='';
}

/* ============ formulaires ============ */
let pile=0, retourAuto=false;
function pousser(){ pile++; try{ history.pushState({c:pile},''); }catch(e){} }
function fermer(){
  const m=document.getElementById('modal');
  if(!m.innerHTML) return;
  m.innerHTML=''; ficheOuverte=null;
  if(pile>0){ pile--; retourAuto=true; try{ history.back(); }catch(e){} }
}
window.addEventListener('popstate', ()=>{
  if(retourAuto){ retourAuto=false; return; }
  const m=document.getElementById('modal');
  if(m.innerHTML){ m.innerHTML=''; ficheOuverte=null; rendre(); }
  else if(onglet!=='jour'){ onglet='jour'; rendre(); }
  if(pile>0) pile--;
  pousser();   // on remet toujours une marque : la touche retour ne quitte jamais l'agenda
});
function val(id){ return document.getElementById(id).value; }
function erreur(m){ const e=document.getElementById('err'); e.textContent=m; e.style.display='block'; }

function formRdv(id,pre){
  pousser();
  const r=id?data.rdv.find(x=>x.id===id):null;
  const v=r||Object.assign({prenom:'',nom:'',tel:'',date:jour,heure:'10:00',duree:45,note:'',proto:''},pre||{});
  const fp=data.gens[cle(v.prenom||'',v.nom||'')]; v.profil=fp?(fp.note||''):'';
  const verrou = !!(pre&&pre.verrou);
  const quand = (id||verrou)
    ? `<input type="hidden" id="f_date" value="${v.date}"><input type="hidden" id="f_heure" value="${v.heure}">`
    : `<div class="duo">
      <div class="field"><label for="f_date">Date</label><input id="f_date" type="date" value="${v.date}"></div>
      <div class="field"><label for="f_heure">Heure</label><input id="f_heure" type="time" value="${v.heure}"></div>
    </div>`;
  const listeP=[...data.protocoles];
  if(v.proto && !listeP.includes(v.proto)) listeP.unshift(v.proto);
  const proto = `<div class="field"><label for="f_proto">Protocole</label><select id="f_proto"><option value="">— aucun protocole —</option>${
    listeP.map(x=>`<option${x===v.proto?' selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  document.getElementById('modal').innerHTML=`
  <div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">
    <p class="sur">Séance</p><h2>${id?'Modifier le rendez-vous':'Nouveau rendez-vous'}</h2>
    <p class="err" id="err"></p>
    <div class="duo">
      <div class="field"><label for="f_prenom">Prénom</label><input id="f_prenom" autocomplete="off" value="${esc(v.prenom)}"><div id="sug_prenom"></div></div>
      <div class="field"><label for="f_nom">Nom</label><input id="f_nom" autocomplete="off" value="${esc(v.nom)}"><div id="sug_nom"></div></div>
    </div>
    <div class="field"><label for="f_profil">Profil — à retenir sur cette personne</label><textarea id="f_profil" placeholder="Ce que vous voulez avoir sous les yeux à chaque séance">${esc(v.profil||'')}</textarea></div>
    <div class="field"><label for="f_tel">Téléphone</label><input id="f_tel" type="tel" value="${esc(v.tel)}"></div>
    ${quand}${proto}
    ${(id||verrou)?`<p style="color:var(--gris);font-size:12.5px;margin:-4px 0 14px">${esc(longDate(v.date))} à ${esc(jolie(v.heure))}${id?' · passez par « Reporter » pour changer la date ou l\'heure.':''}</p>`:''}
    <div class="field"><label for="f_note">Note de séance</label><textarea id="f_note">${esc(v.note)}</textarea></div>
    <div class="sheetacts"><button class="ghost" data-close="1">Annuler</button><button class="primary" data-saverdv="${id||''}">Enregistrer</button></div>
  </div></div>`;
  setTimeout(()=>{ const el=document.getElementById('f_prenom'); if(el) el.focus(); },30);
}

  const dl=Object.values(data.gens).map(p=>`<option value="${esc(p.prenom+' '+p.nom)}">`).join('');

  <div class="overlay" id="ov"><div class="sheet" role="dialog" aria-modal="true">

    <p class="err" id="err"></p>
    <div class="field"><label for="t_titre">Intitulé</label><input id="t_titre" value="${esc(v.titre)}" placeholder="Journée de transmission"></div>
    <div class="duo">
      <div class="field"><label for="t_dd">Du</label><input id="t_dd" type="date" value="${v.date}"></div>
      <div class="field"><label for="t_df">Au</label><input id="t_df" type="date" value="${v.fin}"></div>
    </div>

      <div class="field"><label for="t_debut">Chaque jour de</label><input id="t_debut" type="time" value="${v.debut}"></div>
      <div class="field"><label for="t_finh">à</label><input id="t_finh" type="time" value="${v.finH}"></div>
    </div>

  majParts();
  setTimeout(()=>{ const el=document.getElementById('t_titre'); if(el) el.focus(); },30);

let partEdit=null;
function majParts(){
  const c=document.getElementById('partlist'); if(!c) return;
  c.innerHTML=partTmp.map((p,i)=> i===partEdit
    ? `<div class="pchip"><input id="pedit" value="${esc(p.nom)}"><button data-savepart="${i}" aria-label="Valider">✓</button></div>`
    : `<div class="pchip"><button class="pnom" data-editpart="${i}">${esc(p.nom)}</button><button data-rmpart="${i}" aria-label="Retirer">×</button></div>`
  ).join('');
  if(partEdit!==null){ const e=document.getElementById('pedit'); if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length); } }
}
function validerPart(i){
  const e=document.getElementById('pedit'); if(!e) return;
  const nom=e.value.trim();
  if(nom){
    const t=Object.values(data.gens).find(x=>cle(x.prenom,x.nom)===cle(nom,''));
    partTmp[i]={nom, cle:t?t.cle:null};
  }
  partEdit=null; majParts();
}
function ajouterPart(){
  const i=document.getElementById('t_part'), nom=i.value.trim();
  if(!nom) return;
  const trouve=Object.values(data.gens).find(p=>cle(p.prenom,p.nom)===cle(nom,''));
  partTmp.push({nom, cle:trouve?trouve.cle:null});
  i.value=''; i.focus(); majParts();
}
